{{ define "main" }}
<h2>Recent Posts</h2>
<ul>
  {{ range first 5 (where .Site.RegularPages "Section" "posts") }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  </li>
  {{ end }}
</ul>
{{ end }}
